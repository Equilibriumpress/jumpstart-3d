name: Generate editable CAD model artifacts

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model slug, empty for all"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate native project and viewport preview
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          if [ -n "$MODEL_ID" ]; then node scripts/build-models.mjs "--id=$MODEL_ID"; else node scripts/build-models.mjs; fi
      - run: node scripts/validate-models.mjs
      - name: Upload generated assets for review and PR
        uses: actions/upload-artifact@v4
        with:
          name: cad-models
          path: models/

      - name: Export Domtoren GLB and commit generated model files to PR branch
        if: github.ref_name == 'equilibrium/domtoren-pr02-model' && inputs.model_id == 'domtoren-utrecht'
        run: |
          node mcp/cli.mjs export models/domtoren-utrecht/project.json models/domtoren-utrecht/model.glb --app docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/domtoren-utrecht/project.json models/domtoren-utrecht/preview.png models/domtoren-utrecht/model.glb
          if ! git diff --staged --quiet; then
            git commit -m 'build(domtoren): real JumpStart 3D exports [skip ci]'
            git push origin HEAD:equilibrium/domtoren-pr02-model
          fi
