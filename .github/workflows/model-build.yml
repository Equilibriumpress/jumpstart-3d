name: Generate editable CAD model artifacts

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model slug, empty for all"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate native project and viewport preview
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          if [ -n "$MODEL_ID" ]; then node scripts/build-models.mjs "--id=$MODEL_ID"; else node scripts/build-models.mjs; fi
      - run: node scripts/validate-models.mjs
      - name: Upload generated assets for review and PR
        uses: actions/upload-artifact@v4
        with:
          name: cad-models
          path: models/
