name: Build architecture variety prototypes
on:
  push:
    branches: [equilibrium/test-architecture-variety]
    paths:
      - 'models/test-*/recipe.json'
      - '.github/workflows/architecture-prototypes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cad-prototypes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate three native CAD models and real preview PNGs
        run: |
          for id in test-grachtenpand test-drieboogsbrug test-koepelpaviljoen; do
            node scripts/build-models.mjs "--id=$id"
            node mcp/cli.mjs export "models/$id/project.json" "models/$id/model.glb" --app docs
          done
      - name: Validate models and check output types
        run: |
          node scripts/validate-models.mjs
          node --input-type=module <<'EOF'
          import { readFileSync,statSync } from 'node:fs';
          for(const id of ['test-grachtenpand','test-drieboogsbrug','test-koepelpaviljoen']){
            const base='models/'+id+'/';
            const j=JSON.parse(readFileSync(base+'project.json'));
            if(j.doc.bodies.length < 15) throw Error(id+' needs more than 15 editable CAD bodies');
            if(statSync(base+'preview.png').size < 10000) throw Error(id+' PNG too small');
            if(statSync(base+'model.glb').size < 10000) throw Error(id+' GLB too small');
            console.log(id+': '+j.doc.bodies.length+' native CAD bodies; PNG/GLB OK');
          }
          EOF
      - name: Save generated assets in experiment branch
        run: |
          git add models/test-*/project.json models/test-*/preview.png models/test-*/model.glb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate three verified architecture CAD prototypes"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-variety-prototypes
          path: models/test-*/
