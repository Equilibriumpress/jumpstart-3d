name: Publish JumpStart 3D to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build original browser CAD app
        run: npm run build
      - name: Verify Pages output
        run: |
          test -s docs/index.html
          test -s docs/app.js
          test -s docs/worker.js
          test -s docs/occt-gz.wasm
          test -s docs/sw.js
          test -f docs/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
