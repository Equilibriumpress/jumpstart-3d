name: Generate Domtoren PR2 source artifacts
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/domtoren-utrecht/**'
      - 'models/library.json'
      - '.github/workflows/domtoren-pr02-build.yml'
  push:
    branches:
      - equilibrium/domtoren-pr02-model
    paths:
      - 'models/domtoren-utrecht/**'
      - 'models/library.json'
      - '.github/workflows/domtoren-pr02-build.yml'
permissions:
  contents: write
jobs:
  domtoren-build:
    if: (github.event_name == 'push' && github.ref_name == 'equilibrium/domtoren-pr02-model') || (github.event_name == 'pull_request' && github.head_ref == 'equilibrium/domtoren-pr02-model' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: equilibrium/domtoren-pr02-model
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate native model and real viewport preview
        run: node scripts/build-models.mjs --id=domtoren-utrecht
      - name: Validate CAD geometry and catalog
        run: node scripts/validate-models.mjs
      - name: Export GLB via original CLI
        run: node mcp/cli.mjs export models/domtoren-utrecht/project.json models/domtoren-utrecht/model.glb --app docs
      - name: Commit generated source assets back to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/domtoren-utrecht/project.json models/domtoren-utrecht/preview.png models/domtoren-utrecht/model.glb
          if ! git diff --staged --quiet; then
            git commit -m 'build(domtoren): add verified native CAD project and preview [skip ci]'
            git push origin HEAD:equilibrium/domtoren-pr02-model
          fi
